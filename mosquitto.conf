# Broker de desarrollo para el sistema de seguridad.
# Escucha en la red local; los ESP32 eligen la IP o hostname desde su portal.
listener 1883 0.0.0.0
protocol mqtt

# El firmware y server/server.js actualmente no envian usuario ni clave.
# Usar solo en una red local de confianza. No publicar 1883 en Internet.
allow_anonymous true

persistence false
log_dest stdout
connection_messages true
