<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bridge Arcson Security</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <link rel="icon" href="src/Logos/FaviconBridgeArcson.png" type="image/png">

</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <!-- LOGO -->

        <div class="logo-container">

            <img class="logo-image" src="src/Logos/LogoBridgeArcson.png" alt="Logo Bridge Arcson Security">

            <div class="logo-text">

                <h2 class="logo-title">Bridge Arcson</h2>

                <span class="logo-subtitle">SECURITY SYSTEMS</span>

            </div>

        </div>

        <!-- MENU -->

        <nav class="menu" aria-label="Navegaci&oacute;n principal">

            <div class="menu-category">
                Monitoreo
            </div>

            <ul>

                <li>
                    <a href="#card-cerrojo">Cerrojo</a>
                </li>

                <li>
                    <a href="#card-sensor">Sensor de Movimiento</a>
                </li>

                <li>
                    <a href="#camaras">Cámara</a>
                </li>

            </ul>

        </nav>

        <!-- FOOTER -->

        <div class="sidebar-footer">
            Bridge Arcson Security © 2026
        </div>

    </aside>

    <main class="main-content">

        <!-- TOPBAR -->

        <header class="topbar">

            <!-- LEFT -->

            <div class="topbar-left">

                <h1>
                    Centro de Monitoreo
                </h1>

            </div>

            <!-- RIGHT -->

            <div class="topbar-right">

                <!-- FECHA Y HORA -->

                <div class="datetime">

                    <span id="date"></span>

                    <span id="clock"></span>

                </div>

                <!-- EN VIVO -->

                <div class="live-system" id="conexion">
                    FUERA DE L&Iacute;NEA
                </div>

                <!-- USUARIO -->

                <div class="user-circle">

                    AB

                </div>

            </div>

        </header>

        <!-- CARDS -->

        <section class="cards-container">

            <div class="status-card" id="card-cerrojo">

                <h3>
                    Estado del Cerrojo
                </h3>

                <p class="status danger-status" id="status-cerrojo">
                    Abierto
                </p>

                <div class="card-actions">

                    <button type="button" class="card-btn card-btn-close" id="btn-cerrar">
                        Cerrar puerta
                    </button>

                    <button type="button" class="card-btn card-btn-open" id="btn-abrir">
                        Abrir puerta
                    </button>

                </div>

            </div>

            <div class="status-card" id="card-sensor">

                <h3>
                    Estado del Sensor de Movimiento
                </h3>

                <p class="status danger-status" id="status-sensor">
                    Desactivado
                </p>

                <div class="card-spacer"></div>

            </div>

            <div class="status-card">

                <h3>
                    Estado del Servidor
                </h3>

                <p class="status online-status" id="online-status">
                    Offline
                </p>

                <div class="card-spacer"></div>

            </div>

        </section>

        <!-- CAMARA -->

        <section class="camera-section" id="camaras">

            <div class="section-header">

                <h2>
                    Cámara Principal
                </h2>

            </div>

            <div class="camera-video-frame">
                <img class="camera-box" alt="Transmisi&oacute;n de video de la c&aacute;mara" src="/camera/stream" crossorigin>
                <img class="camera-watermark" src="/src/Logos/LogoBridgeArcson.png" alt="" aria-hidden="true">
            </div>

        </section>

    </main>

    <!-- SOCKET.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- SCRIPT FECHA Y HORA -->

    <script type="module">
        const socket = io();

        socket.on("connect",()=>{
            const conexion =document.getElementById('conexion');
            document.getElementById('online-status').style.color = '#00FF9C';
            document.getElementById('online-status').innerText= "Online"
            conexion.innerText= "EN VIVO"
            conexion.style.color = "#00FF9C"
        });

        socket.on("disconnect",()=>{
            document.getElementById('online-status').style.color = '#FF0000';
            document.getElementById('online-status').innerText= "Offline"
            conexion.innerText= "FUERA DE LINEA"
            conexion.style.color = "#FF0000"
        });

        socket.on("movimiento",(msg)=>{
            const status = document.getElementById('status-sensor');
            if(msg == 'ON'){
                status.textContent = 'Activado';
                status.className = 'status active-status';
            } else {
                status.textContent = 'Desactivado';
                status.className = 'status danger-status';
            }
        });

        socket.on("cerrojo",(msg)=>{
            const status = document.getElementById('status-cerrojo');
            if(msg == 'ON'){
                status.textContent = 'Cerrado';
                status.className = 'status active-status';
            } else {
                status.textContent = 'Abierto';
                status.className = 'status danger-status';
            }
        });

        function updateClock(){

            const now = new Date();

            const date = now.toLocaleDateString('es-AR', {

                weekday:'short',

                day:'numeric',

                month:'short',

                year:'numeric'
            });

            const time = now.toLocaleTimeString('es-AR');

            document.getElementById('date').innerHTML = date;

            document.getElementById('clock').innerHTML = time;
        }

        setInterval(updateClock, 1000);

        updateClock();

        // ABRIR / CERRAR PUERTA
        document.getElementById('btn-cerrar').addEventListener('click', function(){
            const status = document.getElementById('status-cerrojo');
            status.textContent = 'Cerrado';
            status.className = 'status active-status';
            socket.emit('cerrar', true);
        });

        document.getElementById('btn-abrir').addEventListener('click', function(){
            const status = document.getElementById('status-cerrojo');
            status.textContent = 'Abierto';
            status.className = 'status danger-status';
            socket.emit('abrir', true);
        });

    </script>

</body>
</html>
